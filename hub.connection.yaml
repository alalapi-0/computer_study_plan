schema_version: '2.0'
project_id: computer-study-plan
source_refs:
- id: state
  path: docs/PROJECT_STATE.md
  format: markdown
  role: current_state
metric_export:
  entry: scripts/export_hub_metric_snapshot.py
  snapshot: .hub/status.json
mapping:
  current_work.status:
    source_ref: state
    selector:
      heading: Hub 当前管理映射
      label: Status
    value_map: null
  current_work.objective:
    source_ref: state
    selector:
      heading: Hub 当前管理映射
      label: Objective
    value_map: null
  current_work.phase:
    source_ref: state
    selector:
      heading: Hub 当前管理映射
      label: Phase
    value_map: null
  current_work.next_action:
    source_ref: state
    selector:
      heading: Hub 当前管理映射
      label: Next action
    value_map: null
unknown_fields:
  current_work.objective: The Hub 当前管理映射 Objective label is unavailable, missing or ambiguous in the selected State revision.
  current_work.phase: The Hub 当前管理映射 Phase label is unavailable, missing or ambiguous in the selected State revision.
  current_work.round: Round names in the narrative are not one typed current-round field.
  current_work.status: The Hub 当前管理映射 Status label is unavailable, missing or ambiguous in the selected State revision.
  current_work.completed: Slice checkmarks are not a typed whole-project completion boolean.
  current_work.accepted: Design-slice language is not a typed acceptance boolean.
  current_work.next_action: The Hub 当前管理映射 Next action label is unavailable, missing or ambiguous in the selected State revision.
  current_work.owner_role: PROJECT_STATE.md publishes no typed owner-role field.
  progress.completed: Task-done counts belong to study metric rows, not one lifecycle numerator.
  progress.total: The registered 80-task course size is not a Hub completion denominator.
  progress.counting_basis: Counting bases remain attached to each metric row.
  progress.milestones: Phase lists have no typed milestone identity or acceptance fields.
  blockers: The problems section is prose, not a typed blocker list.
  verification.status: UI regression notes are not one typed verification status.
  verification.evidence_refs: Evidence belongs to the study metric rows.
  verification.accepted_basis: There is no typed accepted basis.
  delivery.status: PROJECT_STATE.md publishes no typed delivery status.
  delivery.remote: No typed delivery remote is published in the current-state page.
  delivery.branch: No typed delivery branch is published in the current-state page.
  delivery.commit: No typed delivery commit is published in the current-state page.
  delivery.receipt_ref: No publication receipt is published in the current-state page.
validation_entry:
- python3 -B -m unittest test_hub_metric_snapshot_entry.py
max_read_age_seconds: 604800

# Local SOURCE action contract: scripts/hub_project_actions.py, study-wav-actions/1.
# locate: authenticated GET /api/lab/locate?scenario=<id>&attempt=<uuid>; read-only.
# prepare_wav: authenticated GET /api/lab/attempts/<uuid>/wav; fixed output/tone.wav.
# export_wav: authenticated POST /api/lab/attempts/<uuid>/export-wav; operation_id + exact binding.
# download_wav: authenticated GET /api/lab/exports/<receipt_sha256>; bounded registered bytes.
# normal_route_available: false; original ADAPTER/ROUTES not adopted by this local action contract.
# No genericShell, native adapter registration, dispatch or formal route receipt.
